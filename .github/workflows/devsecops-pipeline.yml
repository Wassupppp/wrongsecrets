name: DevSecOps Pipeline

on:
  push:
    branches: [master, clean-and-security-with-vault]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:

  # ─────────────────────────────────────────
  # ÉTAPE 1 — Scan de secrets (Gitleaks)
  # ─────────────────────────────────────────
  secrets-scan:
    name: "Scan de secrets"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du code (avec tout l'historique)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks — détecter les secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ─────────────────────────────────────────
  # ÉTAPE 2 — Build (Maven compile)
  # ─────────────────────────────────────────
  build:
    name: "Build"
    runs-on: ubuntu-latest
    needs: secrets-scan
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Installer Java 25
        uses: actions/setup-java@v4
        with:
          java-version: "25"
          distribution: "temurin"
          cache: "maven"

      - name: Compiler le projet
        run: ./mvnw --no-transfer-progress clean package -DskipTests

      - name: Sauvegarder le JAR pour les jobs suivants
        uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: target/*.jar
          retention-days: 1

  # ─────────────────────────────────────────
  # ÉTAPE 3 — Tests
  # ─────────────────────────────────────────
  test:
    name: "Tests"
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Installer Java 25
        uses: actions/setup-java@v4
        with:
          java-version: "25"
          distribution: "temurin"
          cache: "maven"

      - name: Lancer les tests
        run: ./mvnw --no-transfer-progress test -Dmaven.test.failure.ignore=true

      - name: Publier le rapport de tests
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: target/surefire-reports/
          retention-days: 7

  # ─────────────────────────────────────────
  # ÉTAPE 4 — SAST (CodeQL)
  # ─────────────────────────────────────────
  sast:
    name: "Analyse statique (CodeQL)"
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Installer Java 25
        uses: actions/setup-java@v4
        with:
          java-version: "25"
          distribution: "temurin"
          cache: "maven"

      - name: Initialiser CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: java
          queries: security-and-quality

      - name: Compiler pour CodeQL
        run: ./mvnw --no-transfer-progress clean package -DskipTests

      - name: Lancer l'analyse CodeQL
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:java"

  # ─────────────────────────────────────────
  # ÉTAPE 5 — Scan de l'image Docker (Trivy)
  # ─────────────────────────────────────────
  container-scan:
    name: "Scan image Docker (Trivy)"
    runs-on: ubuntu-latest
    needs: [test, sast]
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Récupérer le JAR buildé
        uses: actions/download-artifact@v4
        with:
          name: app-jar
          path: target/

      - name: Générer les fichiers manquants pour le build Docker
        run: openssl genrsa -out src/test/resources/RSAprivatekey.pem 2048

      - name: Construire l'image Docker
        run: docker build -t wrongsecrets:${{ github.sha }} .

      - name: Lancer Trivy sur l'image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: wrongsecrets:${{ github.sha }}
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          scanners: vuln
          exit-code: "0"

      - name: Publier les résultats dans GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-results.sarif
          category: trivy-container
